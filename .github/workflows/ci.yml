name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv run pytest -v
      
      - name: Build wheel
        run: uv build --wheel -o livrable

      - uses: actions/upload-artifact@v7
        with:
          name: synthetiser-${{ github.sha }}
          path: livrable

      - name: Cleanup
        run: rm -rf livrable