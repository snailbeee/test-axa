[project]
name = "synthetiser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "llama-cpp-python>=0.3.37",
]


[project.scripts]
test-package = "synthetiser.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
